[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-episode-sim"
version = "0.1.0"
description = "Multi-room RoboCasa household tasks for a TidyBot++/Franka mobile manipulator, with oracle demonstrations, a policy environment and dataset export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Le Thien Phuc Nguyen" }]
dependencies = [
    "molmo-spaces @ git+https://github.com/cortexairobot/molmospaces@d03a259e5df4ab0079e93b0d03216754dee0b627",
    "mujoco==3.5.0",
    "nvidia-curobo[cu12] @ git+https://github.com/NVlabs/curobo@a35a708ecfbb26eb9ab2d7ef22c65919c4fae4a9",
    "torch>=2.7",
    "numpy>=2.0",
    "scipy>=1.14",
    "gymnasium>=1.0",
    "h5py>=3.10",
    "imageio[ffmpeg]",
    "networkx",
    "opencv-python",
    "pillow",
    "trimesh",
]

[project.optional-dependencies]
# Re-convert the espresso machine from MoonlakeAI's USDZ (the data bundle ships the result).
coffee-asset = ["usd-core", "vhacdx"]
dev = ["pytest>=8", "ruff==0.15.0"]

[project.urls]
Repository = "https://github.com/plnguyen2908/cross-episode-robotics-sim"

[tool.setuptools.packages.find]
include = ["cross_episode_sim*"]

[tool.setuptools.package-data]
cross_episode_sim = ["assets/**/*", "configs/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Re-exports the edge-access helpers used by the thin-object pick skill.
"cross_episode_sim/manipulation/thin_edge_pick.py" = ["F401"]
# Set MUJOCO_GL / sys.path before importing MuJoCo or RoboSuite.
"cross_episode_sim/grasping/*.py" = ["E402"]
"cross_episode_sim/controller/base.py" = ["E402"]
"cross_episode_sim/controller/doors.py" = ["E402"]
"cross_episode_sim/manipulation/robocasa.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

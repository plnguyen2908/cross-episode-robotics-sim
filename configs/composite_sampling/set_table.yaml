# Select a subset of control groups per episode; zero selects the baseline.
# count is the total number of attempts.
task: set_table
seed: 42
count: 7
fixed:
  scene.seed: 7
  scene.kitchen_layout: 1
  scene.people: 2
controls:
  execution_order:
    procedure:
      choices:
      - by_place_setting
      - by_object_category
  kitchen_layout:
    scene.kitchen_layout:
      choices:
      - 1
      - 3
  object_instances:
    scene.asset_instance_set:
      choices:
      - baseline
      - same_category_alternatives
  furniture_translation:
    scene.furniture.dining_set.dx:
      uniform:
      - -0.15
      - 0.35
  furniture_rotation:
    scene.furniture.sofa.yaw_deg:
      uniform:
      - -8
      - 8
  door_route:
    room_route:
      choices:
      - default
      - open_shortcut
      - living_room_detour
randomize_controls:
  min_active: 0
  max_active: 6
